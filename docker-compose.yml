services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
    networks:
      - saas_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=saas_db
      - DB_USERNAME=saas_user
      - DB_PASSWORD=saas_pass
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=soporte@turnos-saas.com
      - MAIL_FROM_NAME="Turnos SaaS"
      - FRONTEND_URL=http://localhost:8080
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=evolution_secret_token_saas
      - EVOLUTION_API_INSTANCE=turnos
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      mailpit:
        condition: service_started

  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_queue_worker
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
      - ./backend/docker/php-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
    networks:
      - saas_network
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=saas_db
      - DB_USERNAME=saas_user
      - DB_PASSWORD=saas_pass
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=soporte@turnos-saas.com
      - MAIL_FROM_NAME="Turnos SaaS"
      - FRONTEND_URL=http://localhost:8080
      - EVOLUTION_API_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=evolution_secret_token_saas
      - EVOLUTION_API_INSTANCE=turnos
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    networks:
      - saas_network
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - backend

  webserver:
    image: caddy:2-alpine
    container_name: saas_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - saas_network
    depends_on:
      - backend
      - frontend

  database:
    image: postgres:16-alpine
    container_name: saas_database
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: saas_db
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      DB_DATABASE: saas_db
      DB_USER: saas_user
      DB_PASSWORD: saas_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-testing-db.sh:/docker-entrypoint-initdb.d/init-testing-db.sh:ro
    networks:
      - saas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: saas_cache
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: saas_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - saas_network

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: saas_evolution_api
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_API_KEY=evolution_secret_token_saas
      - CONFIG_SESSION_PHONE_CLIENT=Ubuntu
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://saas_user:saas_pass@database:5432/saas_db?schema=evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - DEL_INSTANCE=false
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

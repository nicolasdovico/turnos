name: Continuous Deployment (CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Zero-Downtime Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Deployment Secrets Configuration
        id: check_secrets
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::warning title=CD Omitido::Los secretos de despliegue (SERVER_SSH_KEY, SERVER_HOST o SERVER_USER) no están configurados en GitHub Secrets. Se omite el despliegue automático a producción sin fallar el workflow."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure SSH Key
        if: steps.check_secrets.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add Server to Known Hosts
        if: steps.check_secrets.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Execute Remote Deployment Commands
        if: steps.check_secrets.outputs.configured == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/var/www/turnos' }}
        run: |
          ssh -p $SERVER_PORT $SERVER_USER@$SERVER_HOST << 'EOF'
            set -e

            echo "🚀 [CD] Iniciando despliegue en producción..."
            cd /var/www/turnos || cd $DEPLOY_PATH

            echo "📦 [CD] Actualizando repositorio desde branch main..."
            git pull origin main

            echo "🐳 [CD] Construyendo y actualizando contenedores Docker..."
            docker compose build --pull
            docker compose up -d --remove-orphans

            echo "🗄️ [CD] Ejecutando migraciones de base de datos..."
            docker compose exec -T backend php artisan migrate --force

            echo "⚡ [CD] Optimizando cachés de Laravel..."
            docker compose exec -T backend php artisan optimize:clear
            docker compose exec -T backend php artisan config:cache
            docker compose exec -T backend php artisan route:cache
            docker compose exec -T backend php artisan view:cache

            echo "💡 [CD] Sincronizando dispositivos IoT..."
            docker compose exec -T backend php artisan iot:sincronizar-luces

            echo "🩺 [CD] Verificando Healthchecks..."
            curl -sf http://localhost:8080/health > /dev/null || curl -sf http://localhost/health > /dev/null
            curl -sf http://localhost:8080/api/health > /dev/null || curl -sf http://localhost/api/health > /dev/null

            echo "✅ [CD] Despliegue completado exitosamente con Zero Downtime."
          EOF

      - name: Report Deployment Status
        run: |
          if [ "${{ steps.check_secrets.outputs.configured }}" = "true" ]; then
            echo "🎉 Despliegue a producción finalizado exitosamente."
          else
            echo "ℹ️ Paso de despliegue omitido de forma segura (sin secretos de servidor configurados en GitHub Secrets)."
          fi

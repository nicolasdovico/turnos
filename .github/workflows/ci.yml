name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. Backend CI (Laravel 11 + PHP 8.3 + PGSQL + Redis)
  # ==========================================
  backend-tests:
    name: Backend Tests (PHP 8.3 & PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas_testing
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, gd, bcmath, mbstring, curl, xml, zip, pcntl, intl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir --working-dir=backend)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Wait for Services & Ensure Databases
        env:
          PGPASSWORD: saas_pass
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U saas_user; do
            echo "Waiting for postgres..."
            sleep 1
          done
          psql -h 127.0.0.1 -p 5432 -U saas_user -d postgres -c "CREATE DATABASE saas_db;" 2>/dev/null || true
          psql -h 127.0.0.1 -p 5432 -U saas_user -d postgres -c "CREATE DATABASE saas_testing;" 2>/dev/null || true

      - name: Setup Environment Files
        run: |
          cat << 'EOF' > backend/.env
          APP_NAME="SaaS Turnos"
          APP_ENV=testing
          APP_KEY=base64:u3G8U5l0wK7vB1xM4pQ6rT8yZ0aC2eE4gH6jL8nO1rQ=
          APP_DEBUG=true
          APP_URL=http://localhost

          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=saas_testing
          DB_DATABASE_TESTING=saas_testing
          DB_USERNAME=saas_user
          DB_PASSWORD=saas_pass

          CACHE_STORE=redis
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array

          REDIS_CLIENT=phpredis
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=null
          EOF
          cp backend/.env backend/.env.testing

      - name: Install Backend Dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Database Migrations
        working-directory: backend
        run: php artisan migrate --force --env=testing
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: saas_testing
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_pass

      - name: Execute Backend Tests (PHPUnit)
        working-directory: backend
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: saas_testing
          DB_USERNAME: saas_user
          DB_PASSWORD: saas_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  # ==========================================
  # 2. Frontend CI (Next.js 14 + Vitest)
  # ==========================================
  frontend-tests:
    name: Frontend Tests (Next.js & Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Execute Frontend Tests (Vitest)
        run: npm --prefix frontend run test

      - name: Build Next.js Application
        run: npm --prefix frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api

  # ==========================================
  # 3. Mobile CI (React Native / Expo + Jest)
  # ==========================================
  mobile-tests:
    name: Mobile Tests (React Native Expo & Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Mobile Dependencies
        run: npm --prefix mobile install

      - name: Execute Mobile Tests (Jest)
        run: npm --prefix mobile test
